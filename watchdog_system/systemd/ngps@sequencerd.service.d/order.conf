# order the sequencer after its peer daemons.
#
# Install to: /etc/systemd/system/ngps@sequencerd.service.d/order.conf
#
[Unit]
After=ngps@messaged.service ngps@acamd.service ngps@slicecamd.service ngps@calibd.service ngps@camerad.service ngps@flexured.service ngps@focusd.service ngps@powerd.service ngps@slitd.service ngps@tcsd.service
Wants=ngps@messaged.service ngps@acamd.service ngps@slicecamd.service ngps@calibd.service ngps@camerad.service ngps@flexured.service ngps@focusd.service ngps@powerd.service ngps@slitd.service ngps@tcsd.service
