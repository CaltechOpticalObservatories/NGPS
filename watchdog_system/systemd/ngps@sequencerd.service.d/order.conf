# order the sequencer after its peer daemons.
#
# Install to: /etc/systemd/system/ngps@sequencerd.service.d/order.conf
#
# The sequencer is the orchestrator; with Type=notify on the peers, this makes
# systemd start sequencerd only after each peer has signaled READY, so the
# sequencer can connect to them immediately on startup. (ZMQ pub/sub tolerates
# start order, but the command-socket connections in sequencerd's main() do not
# retry at boot, so ordering avoids the "ERROR connecting to <daemon>" log.)

[Unit]
After=ngps@messaged.service ngps@acamd.service ngps@slicecamd.service ngps@calibd.service ngps@camerad.service ngps@flexured.service ngps@focusd.service ngps@thermald.service ngps@powerd.service ngps@slitd.service ngps@tcsd.service
Wants=ngps@messaged.service ngps@acamd.service ngps@slicecamd.service ngps@calibd.service ngps@camerad.service ngps@flexured.service ngps@focusd.service ngps@thermald.service ngps@powerd.service ngps@slitd.service ngps@tcsd.service
